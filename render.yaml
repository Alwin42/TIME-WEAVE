services:
  - type: web
    name: time-weave
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Optional: Use a persistent disk for SQLite so data survives deploys
      - key: DATABASE_PATH
        value: /var/data/timeweave.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1